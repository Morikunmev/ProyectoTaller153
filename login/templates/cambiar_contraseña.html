{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="keywords" content="html">
    <meta name="author" content="Richard Rocuant">
    <title>Cambiar Contraseña</title>
    {% tailwind_css %}
    <script>
        // JavaScript para redirigir al login después de 3 segundos con una cuenta regresiva actualizada
        function redirigirAlLogin() {
            let segundos = 3;
            const cuentaRegresiva = setInterval(function() {
                if (segundos > 0) {
                    document.getElementById('contador').textContent = segundos;
                    segundos--;
                } else {
                    clearInterval(cuentaRegresiva);
                    window.location.href = "{% url 'login' %}";
                }
            }, 1000); // Actualiza cada segundo
        }
    </script>
</head>
<body class="flex justify-center items-center h-screen bg-fondo-login bg-cover bg-center">
    <div class="w-full max-w-md p-8 bg-white shadow-lg rounded-lg">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Cambiar Contraseña</h1>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="nueva_contraseña" class="block text-sm font-medium text-gray-700">Nueva Contraseña:</label>
                <input type="password" name="nueva_contraseña" required
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="confirmar_contraseña" class="block text-sm font-medium text-gray-700">Confirmar Contraseña:</label>
                <input type="password" name="confirmar_contraseña" required
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Cambiar Contraseña
                </button>
            </div>
        </form>
        {% if message %}
        <div class="mt-4 text-center">
            <p class="text-white py-2 rounded {% if message_type == 'success' %}bg-green-500{% else %}bg-red-500{% endif %}">
                {{ message }}
            </p>
    
            {% if redirect_to_login %}
                <script>
                    redirigirAlLogin();
                </script>
                <p id="redirect-message" class="mt-2 text-center text-gray-600">
                    Redirigiendo en <span id="contador">3</span> segundos...
                </p>
            {% endif %}
        </div>
    {% endif %}
    </div>
</body>
</html>
