{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Richard Rocuant">
    <title>Inicio de Sesión</title>
    {% tailwind_css %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
        integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #4338ca;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body class="flex justify-center items-center h-screen bg-fondo-login bg-cover bg-center">
    <!-- Loader -->
    <div id="loader" class="loader-container">
        <div class="loader"></div>
    </div>

    <div class="w-96 p-6 shadow-lg bg-white rounded-md bg-opacity-90">
        <!-- Logo -->
        <div class="flex justify-center mb-4">
            <img src="{% static 'images/logo.png' %}" alt="Logo" class="h-17 border-3 border-gray-500 rounded-full">
        </div>
        <h1 class="text-3xl text-center font-semibold text-gray-900"><i class="fa-solid fa-user"></i> Inicio de Sesión</h1>
        <hr class="mt-3">

        {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
            <div
                class="p-2 rounded text-white {% if message.tags == 'error' %}bg-red-500{% elif message.tags == 'success' %}bg-green-500{% else %}bg-blue-500{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mt-3">
                <label for="username" class="block text-base mb-2 text-gray-900">Cuenta de Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingrese su usuario..." required
                    class="border w-full text-base px-2 py-1 focus:outline-none focus:ring-0 focus:border-gray-600">
            </div>
            <div class="mt-3">
                <label for="password" class="block text-base mb-2 text-gray-900">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña..." required
                    class="border w-full text-base px-2 py-1 focus:outline-none focus:ring-0 focus:border-gray-600">
            </div>
            <div class="mt-3 flex justify-between items-center">
                <div>
                    <input type="checkbox" id="remember_me" name="remember_me">
                    <label for="remember_me" class="text-gray-900">Recordarme</label>
                </div>
                <div>
                    <a href="{% url 'correo_recuperacion' %}" class="text-indigo-800 font-semibold">¿Olvidó su
                        Contraseña?</a>
                </div>
            </div>
            <div class="mt-5">
                <button type="submit"
                    class="border-2 border-indigo-700 bg-indigo-700 text-white py-1 w-full rounded-md hover:bg-transparent hover:text-indigo-700 font-semibold"><i
                        class="fa-solid fa-right-to-bracket"></i>&nbsp;&nbsp;Login</button>
            </div>
        </form>
    </div>

    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader');
            loader.classList.add('fade-out');
            
            // Remover el loader después de que la animación de fade out termine
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        });
    </script>
</body>

</html>
