{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Richard Rocuant">
    <title>Inicio de Sesión</title>
    {% tailwind_css %}
</head>
<body>
    <div>
        <img src="{% static 'images/logo.png' %}" alt="Logo">

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="{% if message.tags %}{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div>
                <label for="username">Cuenta de Usuario</label>
                <input type="text" id="username" name="username" placeholder="Cuenta de Usuario" required>
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit">Login</button>
            <div>
                <a href="{% url 'correo_recuperacion' %}">¿Olvidó su Contraseña?</a>
            </div>
        </form>
    </div>
</body>
</html>
