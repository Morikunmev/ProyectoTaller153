{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Richard Rocuant">
    <title>Inicio de Sesión</title>
    {% tailwind_css %}
</head>
<body>
    <div>

        <img src="{% static 'images/logo.png' %}" alt="Logo">

        <form method="POST">
            {% csrf_token %}
            <div>
                <label for="username">Cuenta de Usuario</label>
                <input type="text" id="username" name="username" placeholder="Cuenta de Usuario">
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Contraseña">
            </div>
            <button type="submit">Login</button>
            
            <div>
                <a href="{% url 'correo_recuperacion' %}">¿Olvidó su Contraseña?</a>
            </div>
        </form>
    </div>
</body>
</html>
