{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <!-- Agregamos el script de reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    {% tailwind_css %}
</head>

<body class="flex justify-center items-center h-screen bg-fondo-login bg-cover bg-center">
    <div class="w-full max-w-md p-8 bg-white shadow-lg rounded-lg">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Restablecer Contraseña</h1>

        <!-- Mostrar mensaje -->
        {% if message %}
        <p class="mb-4 text-center text-white py-2 rounded {% if message_type == 'error' %}bg-red-500{% elif message_type == 'success' %}bg-green-500{% else %}bg-blue-500{% endif %}">
            {{ message }}
        </p>
        {% endif %}

        <!-- Formulario -->
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Introduzca su email:</label>
                <input type="email" id="email" name="email" required
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <!-- Contenedor reCAPTCHA -->
            {% if show_captcha %}
            <div class="captcha-container mt-4">
                <div class="g-recaptcha" data-sitekey="{{ RECAPTCHA_SITE_KEY }}"></div>
            </div>
            {% endif %}

            <div class="mt-6">
                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Enviar
                </button>
            </div>
        </form>
    </div>
</body>

</html>
