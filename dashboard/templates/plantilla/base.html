{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'dashboard/style.css' %}">
    {% tailwind_css %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        // Función para mostrar/ocultar submenús
        function toggleSubMenu(submenuId) {
            const submenu = document.getElementById(submenuId);
            submenu.classList.toggle("hidden");
            submenu.classList.toggle("animate-slide-down");
        }

        // Función para ocultar todos los submenús
        function hideAllSubmenus() {
            const submenus = document.querySelectorAll('[id^="submenu-"]');
            submenus.forEach(submenu => {
                submenu.classList.add("hidden");
            });
        }

        // Función para bloquear "Cerrar sesión" al expandir la barra
        function lockLogout() {
            const logoutLink = document.getElementById("logout-link");
            logoutLink.classList.add("disabled-link");
            logoutLink.classList.add("pointer-events-none");
        }

        // Función para desbloquear "Cerrar sesión"
        function unlockLogout() {
            const logoutLink = document.getElementById("logout-link");
            logoutLink.classList.remove("disabled-link");
            logoutLink.classList.remove("pointer-events-none");
        }

        // Escuchar el evento "mouseenter" para bloquear "Cerrar sesión"
        function handleMouseEnter() {
            lockLogout();
            setTimeout(unlockLogout, 300);
        }
    </script>
    <style>
        /* Estilos existentes */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-down {
            animation: slideDown 0.3s ease-out;
        }

        .disabled-link {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Estilos para la barra de desplazamiento */
        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .sidebar-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .sidebar-content {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) rgba(255, 255, 255, 0.1);
        }

        /* Nuevos estilos para el loader */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #4f46e5;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- Loader -->
    <div id="loader" class="loader-container">
        <div class="flex flex-col items-center justify-center">
            <!-- Logo -->
            <img src="{% static 'images/logo.png' %}" alt="Logo" class="w-32 h-32 mb-4 animate-pulse"
                style="animation: pulse 2s infinite;">
            <!-- Loader -->
            <div class="loader mb-4"></div>
            <!-- Texto de carga -->
            <div class="text-gray-600 font-semibold mt-2">Cargando...</div>
        </div>
    </div>




    <!--el h-screen es clave-->
    <!-- Layout principal -->
    <div class="flex h-screen overflow-hidden">
        <!-- Navbar (se mantiene fijo) -->
        {% include 'plantilla/navbar.html' %}

        <!-- Contenedor principal con scroll -->
        <div class="flex-1 overflow-y-auto">
            <div class="p-10">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function () {
            const loader = document.getElementById('loader');
            loader.classList.add('fade-out');

            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        });
    </script>

    <style>
        /* Animación de pulso para el logo */
        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(0.95);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</body>

</html>
